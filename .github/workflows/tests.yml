name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
      - 'uv.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/tests.yml'
      - 'uv.lock'

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      matrix:
        qgis-image-tags:
          - stable-trixie
        qfield-refs:
          - v4.2.9
          - release-4_3
          - master
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - name: Checkout QField
        uses: actions/checkout@v6
        with:
          repository: opengisch/QField
          path: QField
          ref: ${{ matrix.qfield-refs }}

      - name: Install venv
        run: |
          apt update
          apt install -y python3-venv curl

      - name: Create virtualenv and install dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip3 install -q -U uv
          .venv/bin/uv sync
          # The system PyQt6 lacks QML bindings and the PyQt6 wheel must bundle
          # the same Qt minor version as the system, as QGIS uses its private API
          QT_MINOR=$(python3 -c "from PyQt6.QtCore import QT_VERSION_STR; print(QT_VERSION_STR.rsplit('.', 1)[0])")
          .venv/bin/uv pip install --python .venv/bin/python "PyQt6==${QT_MINOR}.*"

      - name: Run tests
        env:
          QFIELD_IMPORTS_DIR: "${{ github.workspace }}/QField/src/qml/imports"
          QGIS_IN_CI: 1
        run: |
          .venv/bin/uv run pytest -v --qgis_disable_gui test
